function devotional(){return '<p class="kick">DAILY DEVOTIONAL</p><div class="dev"><figure class="devfig">'+ART+'</figure><article class="devtxt"><p class="muted">November 5, 2026 | Thursday</p><h1>Gratitude in Ordinary Days</h1><p>'+rc("Romans 1:21")+' <span class="muted">KJV</span></p><blockquote class="verse dv">“Because that, when they knew God, they glorified Him not as God, neither were thankful; but became vain in their imaginations, and their foolish heart was darkened.”</blockquote><p>Paul reminds us that one of humanity’s first steps away from God was failing to give thanks. True worship begins when we recognize God as the Source of every good gift and respond with gratitude.</p><p>This season provides a meaningful bridge between the Jewish and Christian calendars. During Cheshvan, a month without major festivals, God’s people learn faithfulness in ordinary days. As Hanukkah approaches, they remember God’s faithfulness in restoring the Temple after its defilement by Antiochus IV Epiphanes, dedicating themselves anew to the Lord. Christians likewise enter a season of thanksgiving and begin looking toward Advent, anticipating Christ, the Light of the world.</p><p>Today, take a moment to thank God for His faithfulness. His grace is present not only in extraordinary miracles but also in the quiet blessings of everyday life.</p><div class="box"><h2>Prayer</h2><p>Heavenly Father, forgive me for the times I forget to thank You. Teach me to glorify You in all things and to recognize Your faithfulness each day. May gratitude shape my worship and draw me closer to You. In Jesus’ Name. Amen.</p></div></article></div>'}
var DAN=[
["Introduction, Canon, Structure, and Purpose",[
["Section 1. The Name and Place of Daniel in the Canon",["The book is called Daniel because Daniel is both the principal figure and traditionally regarded as its author. The name means “God is my Judge,” fitting the message of divine sovereignty throughout the work. Daniel stands as one of the most influential figures of the Old Testament.","In the English Bible, Daniel is placed among the Major Prophets after Ezekiel. This follows the arrangement of the Septuagint and Latin Vulgate. Most Christians therefore naturally read Daniel as a prophetic book.","In the Hebrew Bible, Daniel belongs to the Kethuvim (Writings), not the Nevi’im (Prophets). Wilson explains that this placement likely reflects Daniel’s role as a wise man and visionary rather than a prophet exercising a public prophetic office. The exact reason remains uncertain because historical evidence is limited."],"How does understanding Daniel as both a wise man and a visionary expand our view of God’s ways of communicating truth?"],
["Section 2. Daniel as Seer and Wise Man",["Wilson notes that Daniel is not explicitly called a <i>nabi</i> (prophet) in the Hebrew sense. Rather, he functions as a <i>chozeh</i> (seer) and <i>chakam</i> (wise man). His ministry occurs within royal courts rather than among covenant communities in Israel.","Biblical prophets often delivered messages directly from God to God’s people. Daniel primarily receives visions, interprets dreams, and serves as an advisor to kings. His experience combines wisdom, governmental service, and revelation.","This distinction helps explain why Daniel’s book differs from Isaiah, Jeremiah, and Ezekiel. Yet Jesus Himself refers to Daniel as a prophet (Matthew 24:15), affirming the prophetic authority of the book."],"How can believers faithfully serve God in secular institutions as Daniel did?"],
["Section 3. Major Sections of the Book",["The Book of Daniel divides naturally into two major parts. Chapters 1-6 contain historical narratives. Chapters 7-12 contain visions and apocalyptic revelations.","The first section demonstrates God’s sovereignty through historical events. Daniel and his friends face persecution, political pressure, and threats to their lives. God repeatedly delivers them and vindicates their faithfulness.","The second section reveals God’s control over world history. Through symbolic visions, God discloses future kingdoms and the ultimate triumph of His kingdom. History is shown moving toward God’s predetermined goal."],"Why is it important to study both the stories and the prophecies of Daniel together?"],
["Section 4. The Languages of Daniel",["Daniel is written in both Hebrew and Aramaic. Hebrew appears in chapters 1, 8-12, while Aramaic appears in 2:4b-7:28. This bilingual structure is unique in the Old Testament.","Wilson argues that the Aramaic of Daniel closely resembles the Aramaic found in Ezra and ancient papyri from the Persian period. He describes it as “Babylonian-Persian Aramaic.”","The use of two languages reflects Daniel’s international context. Hebrew addresses matters concerning Israel, while Aramaic, the international language of the time, addresses concerns related to the nations."],"How does using multiple languages in Scripture demonstrate God’s concern for both His people and the nations?"],
["Section 5. Purpose of the Book",["Daniel is not intended to be a complete biography. Very little is said about Daniel’s family, age, or personal life. The book selects only certain events for theological purposes.","According to Wilson, the primary purpose is to demonstrate God’s sovereignty over nations, kings, nature, and history. Every major story reveals divine control over human affairs.","God directs empires, protects His servants, and fulfills His plans despite opposition. The book therefore encourages faithful endurance during times of uncertainty and suffering."],"Which area of your life most needs the reminder that God remains sovereign and in control?"]]],
["Unity, Genuineness, and Historical Reliability",[
["Section 6. The Unity of the Book",["Many scholars throughout history have questioned whether Daniel was written as a unified work. Some viewed it as a collection of independent documents later combined by editors.","Wilson surveys various theories but points out that many conservative scholars defend the book’s overall unity. The narratives and visions work together to present one consistent theological message.","The recurring emphasis on God’s sovereignty, judgment, and kingdom supports the view that the book possesses substantial literary and theological coherence."],"How does recognizing the unity of Daniel strengthen confidence in its overall message?"],
["Section 7. The Debate over Predictions",["Critics often challenge Daniel because of its remarkably detailed predictions. Some argue that these prophecies must have been written after the events occurred.","Wilson responds that this objection arises largely from philosophical assumptions about whether predictive prophecy is possible. Those who accept divine revelation have no reason to reject genuine prediction.","He also notes that the existence of later apocalyptic writings does not prove Daniel itself is late or fictitious. Genuine prophecy can precede later imitations."],"How does your view of God’s knowledge of the future affect your trust in biblical prophecy?"],
["Section 8. Miracles in Daniel",["Daniel contains several famous miracles: the fiery furnace, the lions’ den, dream revelations, and divine judgment on kings. Critics often question the historical credibility of such events.","Wilson argues that objections to Daniel’s miracles are really objections to the miracle-working God of Scripture. If God’s existence and power are accepted, miracles become possible.","The miracles in Daniel are not random displays of power. Each miracle reveals God’s sovereignty and vindicates faithfulness under persecution."],"What miracle in Daniel most strengthens your confidence in God’s ability to intervene in impossible situations?"],
["Section 9. The Language Argument",["Some critics have argued that Greek and Persian words within Daniel indicate a late date of composition. Wilson carefully examines these linguistic objections.","He argues that trade, warfare, and cultural exchanges make the presence of foreign loanwords entirely plausible during the sixth century BC. Musical instruments especially often retain foreign names.","Archaeological discoveries have repeatedly demonstrated extensive interaction between ancient civilizations. Therefore the language evidence does not require a late date for Daniel."],"Why should Christians approach archaeological discoveries and biblical claims with patience rather than fear?"],
["Section 10. Historical Reliability",["Wilson reviews historical objections related to kings, dates, and places mentioned in Daniel. Critics frequently pointed to figures such as Belshazzar and Darius the Mede.","Many historical criticisms have weakened as new discoveries have emerged. Archaeology has repeatedly clarified issues once used to challenge the book’s reliability.","Wilson argues that Daniel consistently reflects intimate knowledge of the Babylonian and Persian world. Such familiarity supports the historical credibility of its narratives."],"How does historical evidence support confidence in the truthfulness of Scripture?"]]],
["Interpretation, Theology, and Application",[
["Section 11. The Four Kingdoms",["One major interpretive question concerns the identity of the four kingdoms in Daniel’s visions. Wilson supports the traditional sequence of Babylon, Persia, Greece, and Rome.","This interpretation sees God’s kingdom entering history during the period of the fourth empire. The Messianic kingdom ultimately surpasses every human empire.","The message is not merely political prediction. It reveals that earthly powers are temporary while God’s kingdom endures forever."],"What modern “kingdoms” or powers tempt people to trust them more than God’s kingdom?"],
["Section 12. Angelology in Daniel",["Daniel contains some of the Bible’s clearest teaching about angels. Named angels such as Gabriel and Michael appear with specific functions and responsibilities.","Wilson notes that some scholars attribute these ideas to Persian influence. However, evidence from Babylonian religion shows widespread awareness of spiritual beings long before Daniel’s time.","Most importantly, Daniel presents angelic revelation as communication from God. The focus remains on God’s authority rather than speculation about angels themselves."],"How can believers appreciate angelic ministry without becoming distracted from God’s central place in worship?"],
["Section 13. The Resurrection Hope",["Daniel 12:2 contains one of the clearest Old Testament statements about bodily resurrection. It speaks of both everlasting life and everlasting contempt.","Wilson argues that this teaching develops themes already present in earlier Scripture. Daniel does not invent resurrection but expresses it with greater clarity.","The doctrine provides hope that God’s justice extends beyond death. Final judgment and eternal reward are central themes in biblical theology."],"How does the promise of resurrection shape the way believers face suffering and death?"],
["Section 14. The Apocryphal Additions",["Greek versions of Daniel contain additions including the Prayer of Azariah, Song of the Three Children, Susanna, and Bel and the Dragon. These are absent from the Hebrew and Aramaic text.","Protestant churches generally reject these additions as canonical Scripture. Nevertheless, they remain useful for understanding Jewish religious traditions and literary development.","These narratives often emphasize faithfulness, wisdom, and God’s deliverance. However, they do not possess the same canonical authority as the biblical book itself."],"Why is it important to distinguish between useful religious literature and inspired Scripture?"],
["Section 15. The Message of Daniel for Today",["The central message of Daniel is that God rules over history. Empires rise and fall, kings gain and lose power, but God’s kingdom remains forever.","Daniel teaches faithful witness in hostile environments. Daniel and his friends maintained conviction without compromising their loyalty to God.","The book also directs believers toward future hope. God’s victory is certain, His promises are reliable, and His kingdom will ultimately triumph."],"In what area of life is God calling you to stand faithfully like Daniel, even when it is costly?"]]]];
